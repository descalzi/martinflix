# Builds the MartinFlix image and publishes it to GitHub's container registry.
#   Every push to main  → the edge channel:   ghcr.io/descalzi/martinflix:edge and :<date>.<run>
#   Every version tag   → the stable channel: ghcr.io/descalzi/martinflix:stable and :<version>, e.g. v1.2.0 → 1.2.0
# Installations on a channel see the new version in the dashboard's Settings and update from there.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and channel
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CHANNEL=${{ steps.version.outputs.channel }}
          tags: |
            ghcr.io/descalzi/martinflix:${{ steps.version.outputs.version }}
            ghcr.io/descalzi/martinflix:${{ steps.version.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
