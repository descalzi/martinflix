services:
  gluetun:
    ports:
      - "127.0.0.1:${MARTINFLIX_TRANSMISSION_PORT}:9091"
      - "127.0.0.1:${MARTINFLIX_PROWLARR_PORT}:9696"

  transmission:
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  prowlarr:
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  flaresolverr:
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  dashboard:
    environment:
      MARTINFLIX_DOWNLOAD_GATEWAY: gluetun
