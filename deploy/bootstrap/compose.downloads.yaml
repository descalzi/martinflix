services:
  transmission:
    profiles: [transmission]
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
      USER: admin
      FILE__PASS: /run/secrets/transmission_password
      PEERPORT: "${MARTINFLIX_TRANSMISSION_PEER_PORT:-51155}"
      UMASK: "022"
    secrets: [transmission_password]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/transmission:/config"
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}/downloads
        target: /downloads
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -qx 401"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  transmission-auth:
    profiles: [transmission]
    image: busybox:1.37
    restart: unless-stopped
    user: "${MARTINFLIX_UID}:${MARTINFLIX_GID}"
    pid: "service:transmission"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      transmission: {condition: service_started, restart: true}
    command: [sh, /usr/local/bin/transmission-auth]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/transmission:/config"
      - "./transmission-auth.sh:/usr/local/bin/transmission-auth:ro"
      - type: bind
        source: ${MARTINFLIX_STATE_DIR}/download-secrets/transmission_password
        target: /run/transmission-password
        read_only: true

  prowlarr:
    profiles: [prowlarr]
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/prowlarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9696/ping]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  flaresolverr:
    profiles: [flaresolverr]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8191/]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  bazarr:
    profiles: [bazarr]
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/bazarr:/config"
      # Same /data paths as Sonarr and Radarr, so Bazarr needs no path mappings.
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:6767/api/system/ping]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s

secrets:
  transmission_password:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/transmission_password"
