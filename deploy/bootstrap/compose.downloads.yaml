services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.0
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      SERVER_CITIES: "${MARTINFLIX_VPN_CITY:-Prague}"
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: "9091,9696,9999"
      HEALTH_SERVER_ADDRESS: 0.0.0.0:9999
    secrets: [openvpn_user, openvpn_password]
    ports:
      - "127.0.0.1:${MARTINFLIX_TRANSMISSION_PORT}:9091"
      - "127.0.0.1:${MARTINFLIX_PROWLARR_PORT}:9696"

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
      USER: martinflix
      FILE__PASS: /run/secrets/transmission_password
      HOST_WHITELIST: gluetun,localhost
    secrets: [transmission_password]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/transmission:/config"
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}/downloads
        target: /downloads
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -qx 401"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/prowlarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9696/ping]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  dashboard:
    environment:
      MARTINFLIX_DOWNLOAD_STACK: "1"

secrets:
  openvpn_user:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/openvpn_user"
  openvpn_password:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/openvpn_password"
  transmission_password:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/transmission_password"
