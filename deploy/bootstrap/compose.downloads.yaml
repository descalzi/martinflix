services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
      USER: martinflix
      FILE__PASS: /run/secrets/transmission_password
      HOST_WHITELIST: gluetun,transmission,localhost
    secrets: [transmission_password]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/transmission:/config"
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}/downloads
        target: /downloads
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -qx 401"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/prowlarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9696/ping]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8191/]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  dashboard:
    environment:
      MARTINFLIX_DOWNLOAD_STACK: "1"

secrets:
  transmission_password:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/transmission_password"
