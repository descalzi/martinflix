services:
  transmission:
    container_name: ${MARTINFLIX_NAMES:?}-transmission
    profiles: [transmission]
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
      USER: admin
      FILE__PASS: /run/secrets/transmission_password
      PEERPORT: "${MARTINFLIX_TRANSMISSION_PEER_PORT:-51155}"
      UMASK: "022"
    secrets: [transmission_password]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/transmission:/config"
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}/downloads
        target: /downloads
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -qx 401"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  prowlarr:
    container_name: ${MARTINFLIX_NAMES:?}-prowlarr
    profiles: [prowlarr]
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/prowlarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9696/ping]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  flaresolverr:
    container_name: ${MARTINFLIX_NAMES:?}-flaresolverr
    profiles: [flaresolverr]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8191/]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  bazarr:
    container_name: ${MARTINFLIX_NAMES:?}-bazarr
    profiles: [bazarr]
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID}"
      PGID: "${MARTINFLIX_GID}"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/bazarr:/config"
      # Same /data paths as Sonarr and Radarr, so Bazarr needs no path mappings.
      - type: bind
        source: ${MARTINFLIX_MEDIA_PATH}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:6767/api/system/ping]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s

secrets:
  transmission_password:
    file: "${MARTINFLIX_STATE_DIR}/download-secrets/transmission_password"
