services:
  sonarr:
    container_name: ${MARTINFLIX_NAMES:?}-sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID:?Run the bootstrap script}"
      PGID: "${MARTINFLIX_GID:?Run the bootstrap script}"
    ports:
      - "${MARTINFLIX_DASHBOARD_BIND}:${MARTINFLIX_SONARR_PORT}:8989"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/sonarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8989/ping]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 15s

  radarr:
    container_name: ${MARTINFLIX_NAMES:?}-radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: "${MARTINFLIX_UID:?Run the bootstrap script}"
      PGID: "${MARTINFLIX_GID:?Run the bootstrap script}"
    ports:
      - "${MARTINFLIX_DASHBOARD_BIND}:${MARTINFLIX_RADARR_PORT}:7878"
    volumes:
      - "${MARTINFLIX_STATE_DIR}/radarr:/config"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:7878/ping]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 15s

  # The dashboard and the controller run from the MartinFlix image setup itself came from, by its version.
  dashboard:
    container_name: ${MARTINFLIX_NAMES:?}-dashboard
    image: "${MARTINFLIX_IMAGE:?Run setup}"
    pull_policy: never
    command: [dashboard]
    restart: unless-stopped
    user: "${MARTINFLIX_UID}:${MARTINFLIX_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${MARTINFLIX_DASHBOARD_BIND}:${MARTINFLIX_DASHBOARD_PORT}:8765"
    environment:
      MARTINFLIX_BIND: 0.0.0.0
      MARTINFLIX_ADMIN_STATE_FILE: /run/dashboard-auth/password-hash
      MARTINFLIX_ADMIN_PASSWORD_FILE: /run/dashboard-secrets/admin-password
      MARTINFLIX_SONARR_KEY_FILE: /run/dashboard-secrets/sonarr-key
      MARTINFLIX_RADARR_KEY_FILE: /run/dashboard-secrets/radarr-key
      MARTINFLIX_PROWLARR_KEY_FILE: /run/dashboard-secrets/prowlarr-key
      MARTINFLIX_BAZARR_KEY_FILE: /run/dashboard-secrets/bazarr-key
      MARTINFLIX_ARR_COMPOSE_NETWORK: "1"
      MARTINFLIX_SONARR_URL: http://sonarr:8989
      MARTINFLIX_RADARR_URL: http://radarr:7878
      MARTINFLIX_SONARR_WEB_PORT: "${MARTINFLIX_SONARR_PORT:-8989}"
      MARTINFLIX_RADARR_WEB_PORT: "${MARTINFLIX_RADARR_PORT:-7878}"
      MARTINFLIX_TMDB_KEY_FILE: /run/dashboard-secrets/tmdb-key
      MARTINFLIX_PLEX_URL: "${MARTINFLIX_PLEX_URL:-}"
      MARTINFLIX_PLEX_TOKEN_FILE: /run/dashboard-secrets/plex-token
      MARTINFLIX_DISCOVER: "${MARTINFLIX_DISCOVER:-on}"
      MARTINFLIX_DISCOVER_REGION: "${MARTINFLIX_DISCOVER_REGION:-GB}"
      MARTINFLIX_CONTROLLER_URL: http://controller:9800
      MARTINFLIX_BACKUP_DIR: /run/backups
      MARTINFLIX_CONTROLLER_TOKEN_FILE: /run/dashboard-secrets/controller-token
    networks: [default, control]
    volumes:
      - "${MARTINFLIX_STATE_DIR}/dashboard-secrets:/run/dashboard-secrets:ro"
      - "${MARTINFLIX_STATE_DIR}/dashboard-auth:/run/dashboard-auth"
      # This machine's backups, read-only, for the Backups page. The controller writes them.
      - type: bind
        source: ${MARTINFLIX_BACKUP_HOST_DIR}
        target: /run/backups
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -B, -c, "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  # The only container with Docker access. It has no published port and shares a private network with the
  # dashboard alone, and it acts only for a request that carries the PIN chosen during setup.
  controller:
    container_name: ${MARTINFLIX_NAMES:?}-controller
    image: "${MARTINFLIX_IMAGE:?Run setup}"
    pull_policy: never
    command: [controller]
    restart: unless-stopped
    user: "${MARTINFLIX_UID}:${MARTINFLIX_GID}"
    group_add: ["${MARTINFLIX_DOCKER_GID:-0}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
      MARTINFLIX_CONTROL_CONFIG: "${MARTINFLIX_STATE_DIR}/controller/compose.json"
      MARTINFLIX_CONTROL_PIN_FILE: "${MARTINFLIX_STATE_DIR}/controller/pin-hash"
      MARTINFLIX_CONTROL_TOKEN_FILE: "${MARTINFLIX_STATE_DIR}/dashboard-secrets/controller-token"
    networks: [control]
    # Compose runs here with the same file and folder paths as on the host, so the stack's paths stay valid.
    volumes:
      - "${MARTINFLIX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${MARTINFLIX_STATE_DIR}:${MARTINFLIX_STATE_DIR}:ro"
      # Writable so the PIN can be changed and settings handed to setup from the dashboard.
      - "${MARTINFLIX_STATE_DIR}/controller:${MARTINFLIX_STATE_DIR}/controller"
      # Where backups go, at the same path as on the host, and the host's time zone for the 01:00 schedule.
      - type: bind
        source: ${MARTINFLIX_BACKUP_DIR}
        target: ${MARTINFLIX_BACKUP_DIR}
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [CMD, python, -B, -c, "import socket; socket.create_connection(('127.0.0.1', 9800), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Internal: nothing on it reaches the internet. Image downloads are done by the Docker daemon, not the controller.
  control:
    internal: true
