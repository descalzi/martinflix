# martinflix · arr — the VPN and everything that routes through it, plus
# sonarr/radarr which deliberately do not.
#
# Replaces: nordvpn-gluetun.sh, transmission.sh, flaresolverr.sh, prowlarr.sh,
#           bazarr.sh, sonarr.sh, radarr.sh
#
# gluetun MUST live in this file: `network_mode: service:` only resolves inside
# one compose project. That is what buys us `depends_on: service_healthy` —
# nothing routes traffic until the tunnel reports up.
name: martinflix-arr

x-lsio: &lsio
  restart: unless-stopped
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}    # was GUID=1000 — a typo, so the image never saw it
    TZ: ${TZ:-Europe/London}

services:

  nordvpn:
    image: qmcgaw/gluetun
    container_name: nordvpn
    restart: unless-stopped
    # Must stay on the default bridge, like radarr/sonarr. gluetun's firewall
    # allows its own subnet, which is how prowlarr/bazarr reach them on 172.17.x.
    network_mode: bridge
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9091:9091"           # transmission web
      - "51155:51155/tcp"     # transmission peer
      - "51155:51155/udp"
      - "9696:9696"           # prowlarr
      - "6767:6767"           # bazarr
      # - "7788:7788"         # was: stacks   — container exited 2 months ago
      # - "5056:5056"         # was: shelfarr — container exited 2 months ago
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      OPENVPN_USER: ${NORDVPN_USER?set in ~/.config/docker-stacks/martinflix.env}
      OPENVPN_PASSWORD: ${NORDVPN_PASSWORD?set in ~/.config/docker-stacks/martinflix.env}
      SERVER_CITIES: ${NORDVPN_CITIES:-Prague}
      NET_LOCAL: 192.168.4.0/22
      TZ: ${TZ:-Europe/London}
    # gluetun ships its own healthcheck; it is the gate for everything below.

  transmission-daemon:
    <<: *lsio
    image: lscr.io/linuxserver/transmission
    container_name: transmission-daemon
    network_mode: "service:nordvpn"
    depends_on:
      nordvpn: { condition: service_healthy }
    volumes:
      - /var/lib/transmission-daemon:/config
      - /var/lib/transmission-daemon:/app/config
      - /var/lib/transmission-daemon:/kavita/config
      - /tmp/transmission-daemon:/tmp/transmission-daemon
      - /var/lib/transmission-daemon/downloads:/var/lib/transmission-daemon/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/transmission/rpc | grep -qE '200|401|409'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  flaresolverr:
    <<: *lsio
    image: ghcr.io/flaresolverr/flaresolverr
    container_name: flaresolverr
    network_mode: "service:nordvpn"
    depends_on:
      nordvpn: { condition: service_healthy }
    volumes:
      - /var/lib/flaresolverr:/config
      - /var/lib/flaresolverr:/app/config
      - /var/lib/flaresolverr:/kavita/config
      - /tmp/flaresolverr:/tmp/flaresolverr
      - /mnt/martinflix:/mnt/martinflix
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8191/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  prowlarr:
    <<: *lsio
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:nordvpn"
    depends_on:
      nordvpn: { condition: service_healthy }
    volumes:
      - /var/lib/prowlarr:/config
      - /var/lib/prowlarr:/app/config
      - /var/lib/prowlarr:/kavita/config
      - /tmp/prowlarr:/tmp/prowlarr
      - /mnt/martinflix:/mnt/martinflix
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9696/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  bazarr:
    <<: *lsio
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    network_mode: "service:nordvpn"
    depends_on:
      nordvpn: { condition: service_healthy }
      sonarr: { condition: service_healthy }
      radarr: { condition: service_healthy }
    volumes:
      - /var/lib/bazarr:/config
      - /var/lib/bazarr:/app/config
      - /var/lib/bazarr:/kavita/config
      - /tmp/bazarr:/tmp/bazarr
      - /mnt/martinflix:/mnt/martinflix
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6767/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- not on the VPN: bridge networking with published ports (was MODE 3) ---

  sonarr:
    <<: *lsio
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    network_mode: bridge
    ports: ["8989:8989"]
    # Without this, compose starts these in parallel with the VPN side and they
    # mark every indexer failed before prowlarr is listening.
    depends_on:
      prowlarr: { condition: service_healthy }
      transmission-daemon: { condition: service_healthy }
    volumes:
      - /var/lib/sonarr:/config
      - /var/lib/sonarr:/app/config
      - /var/lib/sonarr:/kavita/config
      - /tmp/sonarr:/tmp/sonarr
      - /mnt/martinflix:/mnt/martinflix
      - /var/lib/transmission-daemon/downloads:/var/lib/transmission-daemon/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8989/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s


  radarr:
    <<: *lsio
    image: lscr.io/linuxserver/radarr:nightly
    container_name: radarr
    network_mode: bridge
    ports: ["7878:7878"]
    # Without this, compose starts these in parallel with the VPN side and they
    # mark every indexer failed before prowlarr is listening.
    depends_on:
      prowlarr: { condition: service_healthy }
      transmission-daemon: { condition: service_healthy }
    volumes:
      - /var/lib/radarr:/config
      - /var/lib/radarr:/app/config
      - /var/lib/radarr:/kavita/config
      - /tmp/radarr:/tmp/radarr
      - /mnt/martinflix:/mnt/martinflix
      - /var/lib/transmission-daemon/downloads:/var/lib/transmission-daemon/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7878/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
