# martinflix · core — tailscale, portainer
# Replaces: tailscale.sh, portainer.sh
name: martinflix-core

services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add: [NET_ADMIN, SYS_MODULE]
    volumes:
      - /var/lib/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Europe/London}
      TS_AUTH_ONCE: "true"
      TS_SOCKET: /var/lib/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_ROUTES: 192.168.4.0/22
      TS_EXTRA_ARGS: --advertise-exit-node

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
