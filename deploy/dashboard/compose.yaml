name: martinflix-dashboard
services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/dashboard/Dockerfile
    image: martinflix-dashboard:local
    container_name: martinflix-dashboard
    network_mode: host
    user: "${MARTINFLIX_UID:-1000}:${MARTINFLIX_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      MARTINFLIX_BIND: "${MARTINFLIX_LAN_ADDRESS:-192.168.5.204}"
      MARTINFLIX_ADMIN_PASSWORD_FILE: /run/dashboard-secrets/admin-password
      MARTINFLIX_SONARR_KEY_FILE: /run/dashboard-secrets/sonarr-key
      MARTINFLIX_TAUTULLI_KEY_FILE: /run/dashboard-secrets/tautulli-key
      MARTINFLIX_RADARR_KEY_FILE: /run/dashboard-secrets/radarr-key
      MARTINFLIX_DOCKER_STATUS_FILE: /run/host-status/containers.jsonl
      MARTINFLIX_BACKUP_DIR: /run/backup-manifests
    volumes:
      - type: bind
        source: ${HOME}/.config/martinflix/dashboard-secrets
        target: /run/dashboard-secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.local/state/martinflix-dashboard/status
        target: /run/host-status
        read_only: true
        bind:
          create_host_path: false
