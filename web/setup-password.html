<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{HEADING}} · MartinFlix</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/martinflix-mark.webp" type="image/webp">
  <link rel="stylesheet" href="/style.css">
  <script src="/auth.js" defer></script>
</head>
<body class="setup-page">
  <main class="setup-panel">
    <p class="setup-brand"><img src="/assets/martinflix-mark.webp" width="32" height="32" alt="">MartinFlix</p>
    <h1>{{HEADING}}</h1>
    <p>Choose a password of at least {{MIN_PASSWORD}} characters. You’ll use it to sign in as <strong>admin</strong>.</p>
    {{ERROR}}
    <form action="{{ACTION}}" method="post" class="busy-form">
      <input type="hidden" name="token" value="{{TOKEN}}">
      {{CURRENT}}
      <label for="password">New password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="{{MIN_PASSWORD}}" maxlength="128" required>
        <button type="button" class="password-toggle" aria-controls="password" aria-label="Show new password" aria-pressed="false" hidden>
          <span class="password-eye" aria-hidden="true"></span>
        </button>
      </div>
      <label for="confirm">Confirm password</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="{{MIN_PASSWORD}}" maxlength="128" required>
        <button type="button" class="password-toggle" aria-controls="confirm" aria-label="Show confirmation password" aria-pressed="false" hidden>
          <span class="password-eye" aria-hidden="true"></span>
        </button>
      </div>
      <button type="submit"><span class="button-spinner" aria-hidden="true" hidden></span><span class="button-label">Save password</span></button>
      <p class="form-progress" role="status" hidden>{{PROGRESS}}</p>
    </form>
    <p class="setup-note">After saving, sign in again with your new password.</p>
    {{PASSWORD_SCOPE}}
  </main>
</body>
</html>
