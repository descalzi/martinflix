<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password · MartinFlix</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/auth.js" defer></script>
</head>
<body class="setup-page">
  <main class="setup-panel">
    <p class="setup-brand">MartinFlix</p>
    <h1>Set your dashboard password</h1>
    <p>Choose a password of at least {{MIN_PASSWORD}} characters. You’ll use it to sign in as <strong>admin</strong>.</p>
    {{ERROR}}
    <form action="/setup-password" method="post">
      <input type="hidden" name="token" value="{{TOKEN}}">
      <label for="password">New password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="{{MIN_PASSWORD}}" maxlength="128" required>
        <button type="button" class="password-toggle" aria-controls="password" aria-label="Show new password" aria-pressed="false" hidden>
          <span class="password-eye" aria-hidden="true"></span>
        </button>
      </div>
      <label for="confirm">Confirm password</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="{{MIN_PASSWORD}}" maxlength="128" required>
        <button type="button" class="password-toggle" aria-controls="confirm" aria-label="Show confirmation password" aria-pressed="false" hidden>
          <span class="password-eye" aria-hidden="true"></span>
        </button>
      </div>
      <button type="submit">Save password</button>
    </form>
    <p class="setup-note">After saving, sign in again with your new password.</p>
  </main>
</body>
</html>
